<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <!-- Subtle Spacecraft & Orbit Trajectory Watermark -->
  <defs>
    <linearGradient id="wmOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E3E62" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wmAtmosphereCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Distant Earth Horizon Curvature Arc (Lower quadrant) -->
  <path d="M 250 900 Q 650 580 900 620" stroke="url(#wmAtmosphereCurve)" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M 320 900 Q 670 610 900 650" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Orbital Elliptical Trajectories -->
  <ellipse cx="520" cy="460" rx="420" ry="170" stroke="url(#wmOrbitGrad)" stroke-width="2" stroke-dasharray="10 8" transform="rotate(-30 520 460)"/>
  <ellipse cx="520" cy="460" rx="360" ry="140" stroke="url(#wmOrbitGrad)" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5" transform="rotate(-30 520 460)"/>

  <!-- Telemetry Ground-Station Vector Ray -->
  <line x1="610" y1="330" x2="480" y2="760" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Detailed Orbiting Satellite (Focal Point on Right) -->
  <g transform="translate(610, 330) rotate(-20)">
    
    <!-- Central Satellite Bus Body -->
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="#0284C7" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8"/>

    <!-- High Gain Antenna Dish (Aiming toward Earth link) -->
    <g transform="translate(0, 35)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M -30 32 Q 0 16 30 32" stroke="#38BDF8" stroke-width="3" fill="none"/>
      <line x1="-15" y1="26" x2="0" y2="44" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="15" y1="26" x2="0" y2="44" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="0" cy="44" r="3.5" fill="#38BDF8"/>
      <!-- Radiating carrier rings -->
      <path d="M -12 55 A 14 14 0 0 0 12 55" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M -24 66 A 26 26 0 0 0 24 66" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Solar Array Wings (Extended on Both Sides) -->
    <!-- Left Wing -->
    <g transform="translate(-35, 0)">
      <line x1="0" y1="0" x2="-35" y2="0" stroke="#38BDF8" stroke-width="3"/>
      <g transform="translate(-35, -45)">
        <rect x="-140" y="0" width="140" height="90" rx="4" fill="#0A0F1D" stroke="#38BDF8" stroke-width="2"/>
        <line x1="-105" y1="0" x2="-105" y2="90" stroke="#0284C7" stroke-width="1.5"/>
        <line x1="-70" y1="0" x2="-70" y2="90" stroke="#0284C7" stroke-width="1.5"/>
        <line x1="-35" y1="0" x2="-35" y2="90" stroke="#0284C7" stroke-width="1.5"/>
        <line x1="-140" y1="45" x2="0" y2="45" stroke="#0284C7" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Right Wing -->
    <g transform="translate(35, 0)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#38BDF8" stroke-width="3"/>
      <g transform="translate(35, -45)">
        <rect x="0" y="0" width="140" height="90" rx="4" fill="#0A0F1D" stroke="#38BDF8" stroke-width="2"/>
        <line x1="35" y1="0" x2="35" y2="90" stroke="#0284C7" stroke-width="1.5"/>
        <line x1="70" y1="0" x2="70" y2="90" stroke="#0284C7" stroke-width="1.5"/>
        <line x1="105" y1="0" x2="105" y2="90" stroke="#0284C7" stroke-width="1.5"/>
        <line x1="0" y1="45" x2="140" y2="45" stroke="#0284C7" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Constellation Nodes & Distant Stars -->
  <circle cx="210" cy="240" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="340" cy="180" r="2" fill="#38BDF8" opacity="0.5"/>
  <circle cx="450" cy="120" r="2.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="750" cy="160" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="820" cy="260" r="2" fill="#38BDF8" opacity="0.5"/>
  <circle cx="780" cy="480" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="320" cy="680" r="2" fill="#38BDF8" opacity="0.5"/>
</svg>
